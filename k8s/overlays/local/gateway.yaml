apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  template:
    spec:
      containers:
        - name: gateway
          volumeMounts:
            - name: tls
              mountPath: /etc/gateway-tls
              $patch: delete
            - name: gateway-local
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: tls
          $patch: delete
        - name: gateway-local
          configMap: {name: gateway-local}
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  ports:
    - name: https
      port: 443
      $patch: delete
