apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chat-app
resources: [../../base]
configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - APP_ENV=public
      - RELEASE_ID=RELEASE_REQUIRED
      - ALLOWED_ORIGINS=PUBLIC_ORIGIN_REQUIRED
# scripts/release.py sets real origin, release ID, and all four image digests.
# Do not apply this overlay directly; verify and deploy its signed rendered bundle.
