---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: baatchit-backend:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: backend-config}
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /live, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 2
          startupProbe:
            httpGet: {path: /live, port: 8000}
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: redis-url
              mountPath: /etc/secrets/redis
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: redis-url
          secret:
            secretName: redis-url
            defaultMode: 0440
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis@sha256:47b08295737773de3b711fb86f13ae802f5074e96a9a2d29f5f80164ac08c046
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "/etc/redis-config/redis.conf"]
          ports:
            - containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            tcpSocket: {port: 6379}
            periodSeconds: 2
          livenessProbe:
            tcpSocket: {port: 6379}
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: redis-auth
              mountPath: /etc/redis-auth
              readOnly: true
            - name: redis-config
              mountPath: /etc/redis-config
              readOnly: true
            - name: redis-data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: redis-auth
          secret:
            secretName: redis-auth
            defaultMode: 0440
        - name: redis-config
          configMap:
            name: redis-config
        - name: redis-data
          emptyDir:
            sizeLimit: 16Mi
