# Stateful platform data has a separate lifecycle from application release bundles.
# Single-node local/K3s baseline; do not delete this PVC to roll back application code.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: baatchit}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: baatchit}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: baatchit}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_DB, value: baatchit}
            - {name: POSTGRES_USER, value: baatchit}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-auth, key: password}
          ports: [{containerPort: 5432}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            exec: {command: [pg_isready, -U, baatchit, -d, baatchit]}
            periodSeconds: 3
          livenessProbe:
            exec: {command: [pg_isready, -U, baatchit, -d, baatchit]}
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: tmp, mountPath: /tmp}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
        - name: run
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres, namespace: baatchit}
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [backend, database-migration]}
      ports: [{protocol: TCP, port: 5432}]
  egress: []
