worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 2048; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    upstream backend_pool { server backend:8000; }
    upstream frontend_pool { server frontend:80; }
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_req_zone $binary_remote_addr zone=handshakes:1m rate=5r/s;
    server {
        listen 8080;
        location = /ready { return 200 "ready\n"; }
        location / { return 308 https://$host$request_uri; }
    }
    server {
        listen 8443 ssl;
        ssl_certificate /etc/gateway-tls/tls.crt;
        ssl_certificate_key /etc/gateway-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=86400" always;
        include /etc/nginx/routes.conf;
    }
}
