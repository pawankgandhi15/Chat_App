name: Release
on:
  workflow_dispatch:
    inputs:
      origin:
        description: Actual public HTTPS origin (no trailing slash)
        required: true
        type: string
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/validate.yml
  release:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
        with: {cosign-release: "v3.1.4"}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: bash scripts/install-ci-tools.sh
      - run: echo "$PWD/.local/bin" >> "$GITHUB_PATH"
      - name: Authenticate registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build, scan, sign and package
        env:
          PUBLIC_ORIGIN: ${{ inputs.origin }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
