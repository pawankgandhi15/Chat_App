name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker run --rm -v "$PWD:/src" -w /src --entrypoint sh hashicorp/terraform:1.14.9 scripts/check_infra.sh
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "24"}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m compileall -q backend scripts tests
      - run: python -m pytest tests/unit -q
      - run: node --test tests/frontend/*.test.js
      - run: bash scripts/install-ci-tools.sh
      - run: echo "$PWD/.local/bin" >> "$GITHUB_PATH"
      - run: python scripts/check_manifests.py
      - run: python scripts/local.py up
      - run: python scripts/smoke.py
      - run: python -m pytest tests/integration --integration -q
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/browser --browser-url http://localhost:8080 -q
      - run: python scripts/check_network.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-evidence
          path: artifacts/
          if-no-files-found: ignore
      - if: always()
        run: python scripts/local.py down
